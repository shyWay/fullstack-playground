name: Build 今天做什么 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'today-what-to-do/**'
      - '.github/workflows/build-today-what-to-do-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        working-directory: today-what-to-do/android
        run: /tmp/gradle-8.2.1/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: today-what-to-do-debug-apk
          path: today-what-to-do/android/app/build/outputs/apk/debug/app-debug.apk
